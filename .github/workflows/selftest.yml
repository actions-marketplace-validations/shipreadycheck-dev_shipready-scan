name: Self-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The fixture has known problems (no RLS, unverified Stripe webhook), so the scan must fail at "high".
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          path: tests/fixture
          fail-on: high
      - name: Expect the scan to have failed
        if: steps.scan.outcome != 'failure'
        run: echo "Scanner did not flag the known issues" && exit 1
      # And it must pass when told not to fail.
      - uses: ./
        with:
          path: tests/fixture
          fail-on: none
